name: Auralume Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install project
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller pytest

      - name: Run automated tests
        shell: pwsh
        run: |
          python -m pytest -q

      - name: Build executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean Auralume.spec

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path "dist/Auralume/Auralume.exe")) {
            throw "Auralume.exe was not generated."
          }

          Get-Item "dist/Auralume/Auralume.exe" |
            Select-Object Name, Length

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist/Auralume" `
            -DestinationPath "Auralume-0.1.0-windows-x64.zip" `
            -Force

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Auralume-Windows-x64
          path: Auralume-0.1.0-windows-x64.zip
          if-no-files-found: error
