name: Auralume Windows candidate

on:
  workflow_dispatch:
    inputs:
      upload_candidate:
        description: Upload binaries only after license/source review and owner authorization
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-windows:
    name: Test and package Windows x64
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      AURALUME_MPV_DIR: ${{ github.workspace }}\vendor\mpv

    steps:
      - name: Checkout selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure Python x64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install pinned Python dependencies
        run: |
          python -m pip install -r requirements-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force build/evidence | Out-Null
          python -m pip freeze > build/evidence/python-packages.txt

      - name: Verify inputs and build private native dependencies
        run: python scripts/windows_native.py > build/evidence/native-build.txt

      - name: Load DLL and create actual playback engine
        run: python -m auralume --diagnostics > build/evidence/source-diagnostics.json

      - name: Check script isolation and repeated native player lifecycle
        run: |
          python -X faulthandler -m pytest -vv -ra tests/test_mpv_scripts.py --junitxml=build/evidence/mpv-lifecycle.xml 2>&1 | Tee-Object -FilePath build/evidence/mpv-lifecycle.log
          exit $LASTEXITCODE

      - name: Run complete suite including real libmpv integrations
        run: |
          python -X faulthandler -m pytest -vv -ra --junitxml=build/evidence/pytest-windows.xml 2>&1 | Tee-Object -FilePath build/evidence/pytest-windows.log
          exit $LASTEXITCODE

      - name: Build onedir with bundled DLLs
        run: python -m PyInstaller --noconfirm --clean Auralume.spec

      - name: Package and verify extracted EXE with generated WAV MP3 FLAC
        run: python scripts/verify_windows.py --revision $env:GITHUB_SHA --ffmpeg .tools/windows-native/ffmpeg.exe

      - name: Preserve diagnostic evidence even when native tests abort
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Auralume-windows-diagnostics-${{ github.sha }}
          path: build/evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload candidate for review (no GitHub Release)
        if: ${{ inputs.upload_candidate }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Auralume-windows-x64-candidate-${{ github.sha }}
          path: |
            dist/windows-candidate/
            build/evidence/
          if-no-files-found: error
          retention-days: 14
